name = "ZlibF"
version = "0.1.0"
defaultTargets = ["ZlibF"]

[[lean_lib]]
name = "ZlibF"
# ZlibF.Results is the registry of results; it imports the whole library and checks it.
roots = ["ZlibF", "ZlibF.Results"]

[[lean_lib]]
name = "Regressions"
# The counterexamples kept when a statement or the model was corrected. Each fails if the
# correction is undone. CI builds them with the library (`lake build --wfail ZlibF Regressions`).
srcDir = "tests/verification/regressions"
roots = ["«alloc-ptrdiff»", "«crc-static-address»", "«deflate-getdict-depth-view»", "«getdictionary-frame»", "«gz-macro-have-zero»", "«gz-offset-regular-world»", "«gz-open-emfile»", "«gz-read-budget-fuel»", "«gz-world-closes-fd»", "«gzopen-path-ptrdiff»", "«inflateback-protocol-vacuous»", "«printf-format-undefined»"]
