name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every job runs on every pull request and on every push to main. The manual
  # trigger runs the same jobs on any branch.
  workflow_dispatch:

concurrency:
  # One group per pull request (a newer push cancels the superseded run), and one per commit and event
  # otherwise, so that no pushed head loses its gate result to a later push or a manual dispatch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything must build. This job is the one that has to be green on every push.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: ./.github/actions/lean-environment
        id: lean

      # The module cache is restored in every run and saved only by a push to main (the step after the
      # builds). Lake trusts an .olean whose stored trace matches its inputs, and both come from the cache;
      # so a pull request may only reuse what main built from merged sources, and cannot plant a cache
      # that its own later runs, or anyone else's, would trust. Its changed modules are rebuilt.
      - name: Reuse unchanged module outputs across runs
        id: module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake
            tests/.lake
          key: lean-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'tests/lakefile.toml') }}-${{ hashFiles('ZlibF.lean', 'ZlibF/**/*.lean', 'tests/**/*.lean') }}
          restore-keys: |
            lean-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'tests/lakefile.toml') }}-

      # The library build also checks the registry of results, ZlibF/Results.lean: each theorem's type
      # is exactly its goal, allowed axioms only, and every goal is proved or listed as not done.
      - name: Build the library once
        run: lake build --wfail ZlibF Regressions

      - name: Save the module cache (pushes to main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.module-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake
            tests/.lake
          key: ${{ steps.module-cache.outputs.cache-primary-key }}

      - name: Every string literal of the translations is in strTable
        run: python3 scripts/check-strlit.py

      - name: Safety specifications import no functional specification
        run: python3 scripts/check-spec-layers.py

      - name: Self-tests of the source checks
        run: |
          python3 tests/verification/test_spec_layers.py
          python3 tests/verification/test_strlit_check.py

      - name: Forbidden constructs
        run: |
          if grep -rnE '\b(native_decide|bv_decide|implemented_by)\b|^\s*axiom\b|^\s*(@\[[^]]*\]\s*)?(private\s+|protected\s+|noncomputable\s+)*((partial|unsafe)\s+(def|instance|theorem|abbrev|structure|inductive)\b|opaque\s+[A-Za-z_.]+\s*[:(\[{])|@\[[^]]*\bextern\b' ZlibF.lean ZlibF; then
            echo "forbidden construct found"; exit 1
          fi

      # Options that switch off or weaken checking: the kernel check (debug.skipKernelTC), proofs taken as
      # sorry (debug.byAsSorry and the like), elaboration checks (bootstrap.*), and options passed by the
      # lakefile. A declaration added without the kernel check looks like any other in the environment, so
      # this source check is the guard.
      - name: No option that weakens checking
        run: |
          if grep -rnE '\b(debug|bootstrap)\.[A-Za-z]|\b(allowUnsafeReducibility|warn\.sorry)\b' ZlibF.lean ZlibF \
              || grep -nE 'leanOptions|moreLeanArgs|weakLeanArgs|moreServerArgs' lakefile.toml tests/lakefile.toml; then
            echo "option that weakens checking found"; exit 1
          fi

      # The audit's unsafe/partial rule on the built environment: a recursive def whose compiled code
      # needs an `_unsafe_rec` helper fails here, on every push.
      - name: No unsafe, partial, opaque or extern declaration and no extra axiom in the compiled library
        run: lake env lean --run tests/audit/PartialCheck.lean

      - name: Coverage of the public API (every function of zlib.h has its goals, every required goal is proved)
        run: python3 scripts/verification.py

      - name: The check of ZlibF/Results.lean rejects a wrong type, an extra axiom, an unlisted goal and an unproved required goal
        run: bash tests/results-check/run.sh

      - name: Self-test of the coverage check
        run: python3 tests/verification/test_coverage.py

      - name: Patches apply to the pinned zlib
        run: |
          cp -r zlib /tmp/zlib-verified
          rm -rf /tmp/zlib-verified/.git
          shopt -s nullglob
          for p in patches/*.patch; do (cd /tmp/zlib-verified && git apply "$GITHUB_WORKSPACE/$p"); done

  # The differential test compares the translation with the C. It is needed only when one of the
  # two sides, the runtime they run on, or the test itself changes.
  differential-test-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" HEAD | grep -qE '^(ZlibF/Zlib/|ZlibF/Runtime/|tests/(lean|c|gen)/|tests/[^/]+$|patches/|zlib$|lakefile\.toml$|lean-toolchain$|\.github/)'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "differential test needed: $run"

  # The drivers import only the translation and the runtime, so this job builds those modules and the
  # drivers itself and does not wait for the build job: the two run side by side.
  differential-test:
    needs: differential-test-scope
    if: ${{ needs.differential-test-scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true    # zlib/ at the pinned commit; it is copied, never modified

      - name: Install a C compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patch python3

      - uses: ./.github/actions/lean-environment
        id: lean

      # The same read-only module cache as the build job: what main built from merged sources.
      - name: Reuse unchanged module outputs across runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake
            tests/.lake
          key: lean-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'tests/lakefile.toml') }}-${{ hashFiles('ZlibF.lean', 'ZlibF/**/*.lean', 'tests/**/*.lean') }}
          restore-keys: |
            lean-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'tests/lakefile.toml') }}-

      # tests/ is a separate Lake project that requires the parent project ZlibF by path, so the
      # drivers call the same translation the proofs are about. The lean-toolchain of tests/ is a
      # copy of the root one; keep them equal.
      - name: Toolchains agree
        run: cmp lean-toolchain tests/lean-toolchain

      # Builds the translation and runtime modules the drivers import, and the drivers, with warnings
      # as errors. No proof module is built here.
      - name: Build the differential drivers
        working-directory: tests
        run: |
          mapfile -t names < <(grep -v '^[[:space:]]*\(#\|$\)' list.txt)
          targets=()
          for name in "${names[@]}"; do targets+=("difftest_$name"); done
          lake build --wfail "${targets[@]}"

      # Copies zlib/ to tests/build/zlib, applies patches/*.patch there in name order, and builds
      # libz.a (./configure --static; make libz.a). The submodule is not modified.
      # One run, with the C side built with AddressSanitizer and UBSan: the outputs of the C and of
      # the translation must be identical, and the C reference itself must be free of memory errors
      # and undefined behaviour on every input.
      - name: Build the patched zlib and the Lean drivers, run the differential test under ASan and UBSan
        run: SAN=1 ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh
