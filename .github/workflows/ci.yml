name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_projects: ${{ steps.matrix.outputs.build_projects }}
      difftest_projects: ${{ steps.matrix.outputs.difftest_projects }}
      has_build: ${{ steps.matrix.outputs.has_build }}
      has_difftest: ${{ steps.matrix.outputs.has_difftest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Framework self-tests
        run: python3 -m unittest discover -s framework/tests -p "test_*.py"

      - name: Options, Lakefiles, toolchains, and strict ISO C17 runtime UB policy
        run: |
          python3 framework/check_options.py
          python3 framework/check_runtime_ub.py

      - name: Compute affected project matrices
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 framework/ci_matrix.py

  build:
    needs: scope
    if: ${{ needs.scope.outputs.has_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.scope.outputs.build_projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/lean-environment
        id: lean

      # Pull requests and manual runs may restore a module cache; pushes to main build from scratch
      # and are the sole writers of the module cache, preventing cache poisoning.
      - name: Reuse unchanged module outputs across runs
        if: ${{ github.event_name != 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            projects/${{ matrix.project }}/.lake
            projects/${{ matrix.project }}/tests/.lake
          key: lean-modules-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', format('projects/{0}/lakefile.toml', matrix.project), format('projects/{0}/tests/lakefile.toml', matrix.project)) }}-${{ hashFiles(format('projects/{0}/**/*.lean', matrix.project)) }}
          restore-keys: |
            lean-modules-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', format('projects/{0}/lakefile.toml', matrix.project), format('projects/{0}/tests/lakefile.toml', matrix.project)) }}-

      - name: Build project library with warnings as errors
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mapfile -t targets < <(python3 -c 'import json, os; print("\n".join(json.load(open(f"projects/{os.environ[\"PROJECT\"]}/project.json"))["build"]["targets"]))')
          lake --dir "projects/$PROJECT" build --wfail "${targets[@]}"

      - name: Save module cache (pushes to main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            projects/${{ matrix.project }}/.lake
            projects/${{ matrix.project }}/tests/.lake
          key: lean-modules-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', format('projects/{0}/lakefile.toml', matrix.project), format('projects/{0}/tests/lakefile.toml', matrix.project)) }}-${{ hashFiles(format('projects/{0}/**/*.lean', matrix.project)) }}

      - name: Run full verification gate for project
        run: python3 framework/check_project.py "${{ matrix.project }}" --skip-build

  differential-test:
    needs: scope
    if: ${{ needs.scope.outputs.has_difftest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.scope.outputs.difftest_projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install C compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patch python3

      - uses: ./.github/actions/lean-environment
        id: lean

      - name: Reuse unchanged module outputs across runs
        if: ${{ github.event_name != 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            projects/${{ matrix.project }}/.lake
            projects/${{ matrix.project }}/tests/.lake
          key: lean-modules-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', format('projects/{0}/lakefile.toml', matrix.project), format('projects/{0}/tests/lakefile.toml', matrix.project)) }}-${{ hashFiles(format('projects/{0}/**/*.lean', matrix.project)) }}
          restore-keys: |
            lean-modules-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', format('projects/{0}/lakefile.toml', matrix.project), format('projects/{0}/tests/lakefile.toml', matrix.project)) }}-

      - name: Toolchains agree
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          cmp lean-toolchain "projects/$PROJECT/lean-toolchain"
          if [ -f "projects/$PROJECT/tests/lean-toolchain" ]; then
            cmp lean-toolchain "projects/$PROJECT/tests/lean-toolchain"
          fi

      - name: Build differential drivers and run under ASan and UBSan
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/projects/$PROJECT"
          eval "$(python3 -c '
          import json, os, shlex
          p = json.load(open(f"projects/{os.environ[\"PROJECT\"]}/project.json"))
          dt = p["difftest"]
          up = p["upstream"]["submodule"]
          print("DIFFTEST_DIR=" + shlex.quote(dt["dir"]))
          print("DIFFTEST_LIST=" + shlex.quote(dt.get("list", "")))
          print("DIFFTEST_CMD=" + shlex.quote(dt["command"]))
          print("UPSTREAM_SUB=" + shlex.quote(up))
          ')"
          export PROJECT_DIR
          export UPSTREAM_DIR="$PROJECT_DIR/$UPSTREAM_SUB"
          if [ -n "$DIFFTEST_LIST" ] && [ -f "$PROJECT_DIR/$DIFFTEST_LIST" ]; then
            mapfile -t names < <(grep -v '^[[:space:]]*\(#\|$\)' "$PROJECT_DIR/$DIFFTEST_LIST")
            targets=()
            for name in "${names[@]}"; do targets+=("difftest_$name"); done
            lake --dir "$PROJECT_DIR/$DIFFTEST_DIR" build --wfail "${targets[@]}"
          fi
          (cd "$PROJECT_DIR" && eval "$DIFFTEST_CMD")

  gate:
    if: always()
    needs: [scope, build, differential-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all scheduled verification jobs succeeded
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DIFFTEST_RESULT: ${{ needs.differential-test.result }}
        run: |
          echo "scope=$SCOPE_RESULT build=$BUILD_RESULT differential-test=$DIFFTEST_RESULT"
          [ "$SCOPE_RESULT" = "success" ]
          [ "$BUILD_RESULT" = "success" ] || [ "$BUILD_RESULT" = "skipped" ]
          [ "$DIFFTEST_RESULT" = "success" ] || [ "$DIFFTEST_RESULT" = "skipped" ]
