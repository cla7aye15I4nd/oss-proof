name: Docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - framework/projects.json
      - framework/manifest.py
      - projects/*/project.json
      - projects/*/docs/**
      - projects/*/*/Spec/**
      - projects/*/*/Results.lean
      - projects/*/tests/audit/public-api.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - framework/projects.json
      - framework/manifest.py
      - projects/*/project.json
      - projects/*/docs/**
      - projects/*/*/Spec/**
      - projects/*/*/Results.lean
      - projects/*/tests/audit/public-api.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-proof-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: python3 -m pip install -r site/requirements.txt
      - name: Build unified portal and project subsites
        run: python3 site/build.py
      - name: Audit bilingual pages, links, assets, and Chinese prose
        run: python3 site/check.py
      - name: Run interactive model tests
        run: node --test projects/zlib/docs/web/tests/*.test.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish oss-proof site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
