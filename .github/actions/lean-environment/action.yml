name: Lean environment
description: Install the pinned toolchain
outputs:
  abi:
    description: Native compiler and operating-system identity for compiled module reuse
    value: ${{ steps.platform.outputs.abi }}
runs:
  using: composite
  steps:
    - name: Identify the native build environment
      id: platform
      shell: bash
      run: |
        digest=$({ cat /etc/os-release; uname -m; cc --version; } | sha256sum | cut -d' ' -f1)
        echo "abi=$digest" >> "$GITHUB_OUTPUT"
    - name: Install elan
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none; then
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Could not install elan after 3 attempts"
            exit 1
          fi
          sleep "$((attempt * 5))"
        done
    - name: Install the pinned Lean toolchain
      shell: bash
      run: |
        lean_toolchain_spec=$(cat lean-toolchain)
        for attempt in 1 2 3; do
          if elan toolchain install "$lean_toolchain_spec"; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Could not install the pinned Lean toolchain after 3 attempts"
            exit 1
          fi
          sleep "$((attempt * 5))"
        done
